database:
  # SQLite: the database file is created automatically on first startup.
  sqlite:
    file: "familyheart.db"
    busy-timeout-ms: 10000
    connection-timeout-ms: 10000
    # DB非同期処理用ワーカースレッド数。SQLiteの書き込みはHikariの単一コネクションで
    # 直列化されるため、これを増やしても書き込みスループットは上がらない。
    # 同時に大量のDB要求が来る環境で connectionTimeout に近づく場合のみ調整すること。
    worker-threads: 1
  # Writes are persisted transaction-by-transaction immediately after each plugin-side operation.
  sync-interval-ticks: 20
relationship-limits:
  max-spouses: 1
  max-parents: 2
custom-item:
  # ネタ用の専用サブコマンド。Tab補完には表示しません。
  command: "hdb726yb"
skinship:
  target-range: 3.0
  default-cooldown-seconds: 0
  particles: true
  sounds: true
actions:
  hug:
    cooldown-seconds: 0
    particle: HEART
    sound: ENTITY_PLAYER_LEVELUP
  kiss:
    cooldown-seconds: 0
    particle: HEART
    sound: ENTITY_PLAYER_LEVELUP
  feed:
    cooldown-seconds: 0
    particle: VILLAGER_HAPPY
    sound: ENTITY_PLAYER_BURP
economy:
  enabled: false
  marriage-cost: 0
  divorce-cost: 0
  child-cost: 0
  separation-cost: 0
features:
  requests: true
  gui: true
  skinship: true
  family-buffs: true
  penalties: true
  audit-log: true
  auto-parent: true
  admin: true
buff-task-interval-ticks: 20
debug: false
