name: familyheartplugin
description: Family relationship and RP plugin
prefix: [ Family ]
version: '1.0.0'

main: nekouidaga.net.familyheartplugin.FamilyHeartPlugin
api-version: '26.2'
load: POSTWORLD

authors: [ Ui Tkmy ]
website: plugin.mc.nekouidaga.net/familyheart-plugin

softdepend: [LuckPerms, Vault]
commands:
  familyheart:
    description: FamilyHeartPluginのメインコマンド
    aliases: [family, fh]
    usage: /<command> help
permissions:
  familyheart.use: { default: true }
  familyheart.family: { default: true }
  familyheart.marry: { default: true }
  familyheart.divorce: { default: true }
  familyheart.child: { default: true }
  familyheart.separation: { default: true }
  familyheart.requests: { default: true }
  familyheart.action.hug: { default: true }
  familyheart.action.kiss: { default: true }
  familyheart.action.feed: { default: true }
  familyheart.admin: { default: op }
  familyheart.admin.relation: { default: op }
  familyheart.admin.relation.info: { default: op }
  familyheart.admin.relation.reset: { default: op }
  familyheart.admin.relation.remove: { default: op }
  familyheart.admin.family.info: { default: op }
  familyheart.admin.penalty: { default: op }
  familyheart.admin.penalty.add: { default: op }
  familyheart.admin.penalty.remove: { default: op }
  familyheart.admin.reload: { default: op }
