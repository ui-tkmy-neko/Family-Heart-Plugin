mysql:
  host: localhost
  port: 3306
  database: familyheart
  username: familyheart
  password: "changeme"
  useSSL: false
  pool:
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout-ms: 10000
relationship-limits:
  max-spouses: 1
  max-parents: 2
skinship:
  target-range: 3.0
  default-cooldown-seconds: 0
  particles: true
  sounds: true
actions:
  hug:
    cooldown-seconds: 0
    particle: HEART
    sound: ENTITY_PLAYER_LEVELUP
  kiss:
    cooldown-seconds: 0
    particle: HEART
    sound: ENTITY_PLAYER_LEVELUP
  feed:
    cooldown-seconds: 0
    particle: VILLAGER_HAPPY
    sound: ENTITY_PLAYER_BURP
economy:
  enabled: false
  marriage-cost: 0
  divorce-cost: 0
  child-cost: 0
  separation-cost: 0
features:
  requests: true
  gui: true
  skinship: true
  family-buffs: true
  penalties: true
  audit-log: true
  auto-parent: true
  admin: true
buff-task-interval-ticks: 20
debug: false
